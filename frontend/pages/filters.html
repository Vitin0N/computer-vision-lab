<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>VisionLab - Filtros</title>
  <link rel="stylesheet" href="../assets/css/style.css" />
</head>
<body>
  
  <!-- Header Padrão -->
  <header class="top-header">
    <a href="/" class="logo-area" title="Início">
      <div class="logo-icon"><img src="../assets/img/cv_logo.png" alt="Logo"></div>
      <span class="logo-text">Computer Vision Lab</span>
    </a>

    <!-- Links de navegação entre as páginas -->
    <nav class="nav-tabs">
      <a href="/pages/filters" class="nav-tab active">Filtros</a>
    </nav>

    <div style="display: flex; gap: 10px; align-items: center;">
      <button class="btn-camera" id="btnWebcam">Usar Câmera</button>
      <button id="themeToggle" class="icon-action-btn" title="Alternar tema"></button>
    </div>
  </header>

  <div class="main-wrapper">
    <!-- Sidebar com sub-operações de filtros -->
    <aside class="sidebar">
      <span class="sidebar-title">Filtros</span>

      <details class="filter-category" open>
        <summary>Geral</summary>
        <div class="filter-options">
          <button class="subfilter-btn active" data-op="cinza">Escala de Cinza</button>
          <button class="subfilter-btn" data-op="negativo">Complemento / Negativo</button>
        </div>
      </details>

      <details class="filter-category">
        <summary>Intensidade</summary>
        <div class="filter-options">
          <button class="subfilter-btn" data-op="threshold">Limirização</button>
          <button class="subfilter-btn" data-op="log">Transformação Logarítmica</button>
          <button class="subfilter-btn" data-op="potencia">Transformação de Potencia</button>
          <button class="subfilter-btn" data-op="equalizar">Equalização</button>
          <button class="subfilter-btn" data-op="fat-intensidade">Fatiamento de intensidade</button>
        </div>
      </details>

      <details class="filter-category">
        <summary>Espaciais</summary>
        <div class="filter-options">
          <button class="subfilter-btn" data-op="blur-gaussiano">Blur Gaussiano</button>
          <button class="subfilter-btn" data-op="media">Filtro de Média</button>
          <button class="subfilter-btn" data-op="mediana">Filtro de Mediana</button>
          <button class="subfilter-btn" data-op="max">Filtro de Máximo</button>
          <button class="subfilter-btn" data-op="min">Filtro de Mínimo</button>
        </div>
      </details>

      <details class="filter-category">
        <summary>Detecção de Bordas / Realce</summary>
        <div class="filter-options">
          <button class="subfilter-btn" data-op="bordas-sobel">Detecção de Bordas (Sobel)</button>
          <button class="subfilter-btn" data-op="bordas-laplace">Detecção de Bordas (Laplace)</button>
          <button class="subfilter-btn" data-op="bordas-canny">Detecção de Bordas (Canny)</button>
          <button class="subfilter-btn" data-op="agucamento">Máscara de Aguçamento</button>
        </div>
      </details>
    </aside>

    <!-- Workspace Lado a Lado -->
    <main class="workspace">
      <div class="pipeline-container">
        <!-- Entrada -->
        <section class="card">
          <div class="card-header"><span>Original</span></div>
          <div class="image-dropzone">
            <span class="placeholder-text">Nenhuma imagem carregada</span>
            <!-- Imagem estática -->
            <img id="previewOriginal" style="display: none;" alt="Original" />

            <!-- Elemento de video e webcam -->
            <video id="videoElement" autoplay playsinline style="display: none; width: 100%;"></video>
            <canvas id="canvasElement" style="display: none;;"></canvas>
          </div>
          <div class="card-footer">
            <input type="file" id="fileUpload" accept="image/*, video/*" style="display: none;" />
            <button class="btn-primary" onclick="document.getElementById('fileUpload').click()">Enviar Arquivo</button>
          </div>
        </section>

        <div class="pipeline-arrow">&rarr;</div>

        <!-- Saída -->
        <section class="card">
          <div class="card-header">
            <span>Processada</span>
            <span id="latencyBadge" style="font-size: 11px; color: var(--accent-color);">Pronto</span>
          </div>
          <div class="image-dropzone">
            <span class="placeholder-text">O resultado aparecerá aqui</span>
            <img id="previewResult" style="display: none;" alt="Resultado" />
          </div>
          <div class="card-footer right">
            <a id="btnDownload" class="btn-secondary" style="display: none; text-decoration: none;" download="resultado.jpg">Baixar</a>
          </div>
        </section>
      </div>

      <!-- Parâmetros do filtro -->
      <section class="params-bar">
        <div id="dynamicParamsContainer"></div>
        <button class="btn-primary" id="btnExecute" style="margin-left: auto;">Aplicar Filtro</button>
      </section>
    </main>
  </div>

  <!-- Importa apenas o script específico desta página -->
  <script type="module" src="../assets/js/filters.js"></script>
</body>
</html>
